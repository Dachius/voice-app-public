<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#171a21">
<meta name="mobile-web-app-capable" content="yes">
<title>Voice App</title>
<link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials">
<link rel="icon" href="/static/icon-192.png">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<link rel="stylesheet" href="/static/style.css?v=4">
</head>
<body>
<div id="app">
  <header>
    <button id="menu" title="Conversations">☰</button>
    <div class="title"><span id="title">…</span><span class="sub" id="subtitle"></span></div>
    <button id="interrupt" title="Interrupt the running turn" hidden>■</button>
  </header>
  <div id="status"></div>
  <div id="transcript"></div>
  <form id="composer">
    <textarea id="input" rows="1" placeholder="Message… (Enter to send, Shift+Enter for newline)"></textarea>
    <button id="mic" type="button" title="Voice mode on/off">🎙</button>
    <button class="primary" id="send" type="submit">Send</button>
  </form>
  <div id="voicebar" hidden>
    <span id="vdot"></span><span id="vstate">off</span>
    <span class="spacer"></span>
    <button id="v-scratch" type="button" title="Drop the last thing you said">Scratch</button>
    <button id="v-hold" type="button" title="Freeze the send countdown">Hold</button>
    <button id="v-send" type="button" class="primary" title="End your turn now">Send</button>
    <button id="v-stop" type="button" class="danger" title="Stop speaking / interrupt" hidden>Stop</button>
  </div>
  <audio id="tts" preload="auto"></audio>
</div>

<div id="drawer">
  <div class="panel">
    <div class="newconv">
      <select id="backend"></select>
      <select id="model"></select>
      <button class="primary" id="new">New conversation</button>
    </div>
    <div id="convs"></div>
    <div class="spacer"></div>
    <div class="settings">
      <label>Voice <select id="ttsVoice"></select></label>
      <label>Speed <input id="ttsSpeed" type="number" min="0.5" max="2" step="0.05"></label>
    </div>
    <div class="hint">Tap a conversation to open it. Long-press / right-click to delete.</div>
  </div>
</div>

<script src="/static/vendor/marked.min.js"></script>
<script src="/static/vendor/vad/vad.bundle.min.js"></script>
<script src="/static/app.js?v=4"></script>
<script src="/static/voice.js?v=8"></script>
</body>
</html>
